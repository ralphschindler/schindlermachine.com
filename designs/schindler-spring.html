<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schindler Spring Company</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Replaces lucide-react for standalone usage) ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Menu = (props) => <IconWrapper {...props}><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></IconWrapper>;
        const X = (props) => <IconWrapper {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>;
        const Phone = (props) => <IconWrapper {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconWrapper>;
        const Mail = (props) => <IconWrapper {...props}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></IconWrapper>;
        const MapPin = (props) => <IconWrapper {...props}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></IconWrapper>;
        const Clock = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
        const ArrowRight = (props) => <IconWrapper {...props}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></IconWrapper>;
        const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
        const ChevronRight = (props) => <IconWrapper {...props}><polyline points="9 18 15 12 9 6"/></IconWrapper>;
        const Settings = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconWrapper>;
        const Truck = (props) => <IconWrapper {...props}><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></IconWrapper>;
        const Shield = (props) => <IconWrapper {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></IconWrapper>;

        // --- App Components ---

        const Logo = ({ className = "h-12 w-auto" }) => (
          <svg className={className} viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            {/* Abstract Spring Coil Representation */}
            <path d="M20 10 C 20 10, 80 10, 80 20 C 80 30, 20 30, 20 40 C 20 50, 80 50, 80 60 C 80 70, 20 70, 20 80 C 20 90, 80 90, 80 100 C 80 110, 20 110, 20 110" 
                  stroke="currentColor" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" />
            {/* The 'S' */}
            <path d="M60 45 C 55 40, 40 40, 35 48 C 30 56, 65 65, 60 85 C 55 95, 40 90, 35 85" 
                  stroke="white" strokeWidth="8" strokeLinecap="round" fill="none" />
            <path d="M60 45 C 55 40, 40 40, 35 48 C 30 56, 65 65, 60 85 C 55 95, 40 90, 35 85" 
                  stroke="currentColor" strokeWidth="3" strokeLinecap="round" fill="none" />
          </svg>
        );

        const NavLink = ({ href, children, mobile = false, onClick }) => (
          <a 
            href={href} 
            onClick={onClick}
            className={`
              ${mobile ? 'block w-full px-4 py-3 hover:bg-slate-800' : 'inline-block px-4 py-2 hover:text-orange-500'}
              transition-colors duration-200 font-medium uppercase tracking-wider text-sm
            `}
          >
            {children}
          </a>
        );

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
          const baseStyle = "inline-flex items-center justify-center px-6 py-3 border text-base font-medium rounded-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2";
          const variants = {
            primary: "border-transparent text-white bg-orange-600 hover:bg-orange-700 focus:ring-orange-500 shadow-sm",
            secondary: "border-slate-300 text-slate-700 bg-white hover:bg-slate-50 focus:ring-slate-500",
            outline: "border-white text-white hover:bg-white/10"
          };
          
          return (
            <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
              {children}
            </button>
          );
        };

        const SectionHeading = ({ subtitle, title, align = 'center' }) => (
          <div className={`mb-12 ${align === 'center' ? 'text-center' : 'text-left'}`}>
            {subtitle && (
              <span className="block text-orange-600 font-bold tracking-widest uppercase text-sm mb-2">
                {subtitle}
              </span>
            )}
            <h2 className="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">
              {title}
            </h2>
            <div className={`mt-4 h-1 w-20 bg-orange-600 ${align === 'center' ? 'mx-auto' : ''}`}></div>
          </div>
        );

        const FeatureCard = ({ icon: Icon, title, description }) => (
          <div className="bg-white p-8 rounded-sm shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-300 relative overflow-hidden group">
            <div className="absolute top-0 left-0 w-1 h-full bg-orange-600 transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>
            <div className="w-12 h-12 bg-slate-100 rounded-sm flex items-center justify-center mb-6 text-orange-600 group-hover:bg-orange-600 group-hover:text-white transition-colors duration-300">
              <Icon size={24} />
            </div>
            <h3 className="text-xl font-bold text-slate-900 mb-3">{title}</h3>
            <p className="text-slate-600 leading-relaxed">{description}</p>
          </div>
        );

        const ProductItem = ({ name }) => (
          <div className="flex items-center space-x-3 p-4 bg-slate-50 border border-slate-100 rounded-sm hover:border-orange-200 transition-colors">
            <ChevronRight className="text-orange-500 flex-shrink-0" size={20} />
            <span className="font-semibold text-slate-700">{name}</span>
          </div>
        );

        function App() {
          const [isScrolled, setIsScrolled] = useState(false);
          const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

          useEffect(() => {
            const handleScroll = () => {
              setIsScrolled(window.scrollY > 50);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
              
              {/* Top Bar - Corporate Industrial Feel */}
              <div className="bg-slate-900 text-slate-300 py-2 px-4 text-xs md:text-sm border-b border-slate-800">
                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center space-y-2 md:space-y-0">
                  <div className="flex items-center space-x-6">
                    <span className="flex items-center">
                      <Clock size={14} className="mr-2 text-orange-500" />
                      24/7 Emergency Service Available
                    </span>
                    <span className="hidden md:flex items-center">
                      <MapPin size={14} className="mr-2 text-orange-500" />
                      Hammond, Louisiana
                    </span>
                  </div>
                  <div className="flex items-center space-x-6 font-medium">
                    <a href="tel:9853738482" className="hover:text-white transition-colors flex items-center">
                      <Phone size={14} className="mr-2" />
                      985.373.8482
                    </a>
                    <a href="mailto:Mark@SchindlerSpring.com" className="hover:text-white transition-colors flex items-center">
                      <Mail size={14} className="mr-2" />
                      Email Us
                    </a>
                  </div>
                </div>
              </div>

              {/* Main Navigation */}
              <nav className={`sticky top-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-white shadow-md py-2' : 'bg-white py-4'}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center">
                    {/* Logo Area */}
                    <div className="flex items-center group cursor-pointer">
                      <div className="bg-slate-900 p-2 rounded-sm group-hover:bg-orange-600 transition-colors duration-300">
                        <Logo className="h-8 w-auto text-white" />
                      </div>
                      <div className="ml-3 flex flex-col">
                        <span className="text-xl font-black text-slate-900 tracking-tighter uppercase leading-none">Schindler</span>
                        <span className="text-sm font-bold text-slate-500 uppercase tracking-widest leading-none">Spring Co.</span>
                      </div>
                    </div>

                    {/* Desktop Menu */}
                    <div className="hidden md:flex items-center space-x-2">
                      <NavLink href="#home">Home</NavLink>
                      <NavLink href="#about">About</NavLink>
                      <NavLink href="#products">Products</NavLink>
                      <NavLink href="#capabilities">Capabilities</NavLink>
                      <Button variant="primary" className="ml-4 py-2 px-4 text-sm uppercase tracking-wider" onClick={() => document.getElementById('contact').scrollIntoView({behavior: 'smooth'})}>
                        Request Quote
                      </Button>
                    </div>

                    {/* Mobile Menu Button */}
                    <div className="md:hidden">
                      <button 
                        onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                        className="text-slate-900 p-2 focus:outline-none"
                      >
                        {mobileMenuOpen ? <X size={28} /> : <Menu size={28} />}
                      </button>
                    </div>
                  </div>
                </div>

                {/* Mobile Menu Dropdown */}
                {mobileMenuOpen && (
                  <div className="md:hidden bg-slate-900 text-white absolute w-full left-0 top-full shadow-xl">
                    <NavLink mobile href="#home" onClick={() => setMobileMenuOpen(false)}>Home</NavLink>
                    <NavLink mobile href="#about" onClick={() => setMobileMenuOpen(false)}>About</NavLink>
                    <NavLink mobile href="#products" onClick={() => setMobileMenuOpen(false)}>Products</NavLink>
                    <NavLink mobile href="#capabilities" onClick={() => setMobileMenuOpen(false)}>Capabilities</NavLink>
                    <div className="p-4">
                      <Button variant="primary" className="w-full" onClick={() => {
                        setMobileMenuOpen(false);
                        document.getElementById('contact').scrollIntoView({behavior: 'smooth'});
                      }}>Contact Us</Button>
                    </div>
                  </div>
                )}
              </nav>

              {/* Hero Section */}
              <section id="home" className="relative bg-slate-900 overflow-hidden">
                {/* Abstract Industrial Background */}
                <div className="absolute inset-0 opacity-20">
                    <svg width="100%" height="100%">
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" strokeWidth="1"/>
                        </pattern>
                        <rect width="100%" height="100%" fill="url(#grid)" />
                    </svg>
                </div>
                
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 py-24 md:py-32 lg:py-40">
                  <div className="lg:w-2/3">
                    <div className="inline-flex items-center px-3 py-1 rounded-sm border border-orange-500/30 bg-orange-500/10 text-orange-400 font-semibold tracking-wider text-xs uppercase mb-6">
                      <span className="w-2 h-2 rounded-full bg-orange-500 mr-2"></span>
                      Family Tradition Since 1918
                    </div>
                    <h1 className="text-4xl md:text-6xl font-extrabold text-white tracking-tight leading-tight mb-6">
                      Precision Manufacturing <br/>
                      <span className="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-orange-600">
                        When You Need It.
                      </span>
                    </h1>
                    <p className="text-xl text-slate-400 mb-10 max-w-2xl leading-relaxed">
                      Custom spring manufacturing for all purposes. From prototypes to production runs, we deliver the highest quality components with industry-leading turnaround times.
                    </p>
                    <div className="flex flex-col sm:flex-row gap-4">
                      <Button variant="primary" className="uppercase tracking-widest text-sm font-bold">
                        Get a Fast Quote
                      </Button>
                      <Button variant="outline" className="uppercase tracking-widest text-sm font-bold">
                        View Capabilities
                      </Button>
                    </div>
                  </div>
                </div>
                
                {/* Decorative Industrial Elements */}
                <div className="absolute right-0 bottom-0 opacity-10 hidden lg:block">
                   <Logo className="h-96 w-auto text-white transform translate-x-1/3 translate-y-1/3" />
                </div>
              </section>

              {/* Core Values / Features */}
              <section className="py-20 bg-white relative z-20 -mt-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <FeatureCard 
                      icon={Truck}
                      title="Short-Order Specialty"
                      description="Deadlines matter. Short order is our specialty. Call us today and have your springs tomorrow. We keep your production line moving."
                    />
                    <FeatureCard 
                      icon={Settings}
                      title="Made to Order"
                      description="Custom manufacturing for your specific needs. From .005” to .625” cold-coil material, if you can design it, we can manufacture it."
                    />
                    <FeatureCard 
                      icon={Shield}
                      title="3 Generations of Quality"
                      description="A family tradition of excellence since 1918. You aren't just an account number; you're a partner backed by a century of experience."
                    />
                  </div>
                </div>
              </section>

              {/* About Section */}
              <section id="about" className="py-20 bg-slate-50">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex flex-col lg:flex-row items-center gap-16">
                    <div className="lg:w-1/2">
                      <div className="relative">
                        {/* Abstract Industrial Image Placeholder */}
                        <div className="aspect-video bg-slate-800 rounded-sm shadow-xl flex items-center justify-center relative overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-tr from-slate-900 to-transparent opacity-80"></div>
                            <div className="relative z-10 text-center p-8">
                                <div className="text-6xl font-black text-orange-600 mb-2">100+</div>
                                <div className="text-xl font-medium text-white uppercase tracking-widest">Years of Experience</div>
                            </div>
                        </div>
                        <div className="absolute -bottom-6 -right-6 w-24 h-24 bg-orange-600 rounded-sm flex items-center justify-center text-white font-bold text-center text-xs p-2 shadow-lg leading-tight">
                          EST.<br/>1918
                        </div>
                      </div>
                    </div>
                    <div className="lg:w-1/2">
                      <SectionHeading align="left" subtitle="Who We Are" title="A Century of Precision" />
                      <p className="text-lg text-slate-700 mb-6 leading-relaxed">
                        Schindler Spring Company is a premier custom spring manufacturer located in Hammond, Louisiana. We combine old-world craftsmanship with modern manufacturing techniques to deliver superior results.
                      </p>
                      <p className="text-slate-600 mb-8 leading-relaxed">
                        We are proud to be a family-owned business with three generations of experience. This legacy drives our commitment to quality—you know you're getting springs that meet the highest standards of durability and precision.
                      </p>
                      <ul className="space-y-4 mb-8">
                        {[
                          "Rapid Response Manufacturing",
                          "Expert Material Selection (.005\" to .625\")",
                          "Personalized Customer Service",
                          "Rush Delivery Available"
                        ].map((item, i) => (
                          <li key={i} className="flex items-center text-slate-700">
                            <CheckCircle className="text-orange-500 mr-3" size={20} />
                            {item}
                          </li>
                        ))}
                      </ul>
                      <Button variant="primary" className="text-sm uppercase font-bold tracking-wider">
                        Learn Our History
                      </Button>
                    </div>
                  </div>
                </div>
              </section>

              {/* Products Grid */}
              <section id="products" className="py-20 bg-white border-t border-slate-100">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <SectionHeading subtitle="Capabilities" title="What We Manufacture" />
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-12">
                    {[
                      "Compression Springs",
                      "Torsion Springs",
                      "Extension Springs",
                      "Power Springs",
                      "Wire Forms",
                      "Spring Washers",
                      "Custom Metal Components",
                      "Cold-Coil Springs",
                      "Rush Orders"
                    ].map((product, idx) => (
                      <ProductItem key={idx} name={product} />
                    ))}
                  </div>

                  <div className="mt-16 bg-slate-900 rounded-sm p-8 md:p-12 text-center md:text-left relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-8 opacity-5">
                      <Settings size={200} className="text-white" />
                    </div>
                    <div className="relative z-10 flex flex-col md:flex-row items-center justify-between gap-8">
                      <div>
                        <h3 className="text-2xl font-bold text-white mb-2">Need a Custom Specification?</h3>
                        <p className="text-slate-400">
                          We handle materials ranging from <span className="text-white font-mono bg-slate-800 px-2 py-1 rounded">.005"</span> to <span className="text-white font-mono bg-slate-800 px-2 py-1 rounded">.625"</span>.
                        </p>
                      </div>
                      <Button variant="primary" className="flex-shrink-0 whitespace-nowrap">
                        Submit Specifications <ArrowRight className="ml-2" size={18} />
                      </Button>
                    </div>
                  </div>
                </div>
              </section>

              {/* Stats/Industrial Strip */}
              <section className="py-12 bg-orange-600 text-white">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center divide-y md:divide-y-0 md:divide-x divide-orange-500/50">
                    <div className="p-4">
                      <div className="text-4xl font-black mb-1">24/7</div>
                      <div className="text-orange-100 font-medium uppercase tracking-wider text-sm">Operation Availability</div>
                    </div>
                    <div className="p-4">
                      <div className="text-4xl font-black mb-1">100%</div>
                      <div className="text-orange-100 font-medium uppercase tracking-wider text-sm">Made to Order</div>
                    </div>
                    <div className="p-4">
                      <div className="text-4xl font-black mb-1">Fast</div>
                      <div className="text-orange-100 font-medium uppercase tracking-wider text-sm">Turnaround Times</div>
                    </div>
                  </div>
                </div>
              </section>

              {/* Contact / Footer */}
              <footer id="contact" className="bg-slate-900 text-white pt-20 pb-10 border-t-4 border-orange-600">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 mb-16">
                    
                    {/* Brand Column */}
                    <div className="col-span-1 lg:col-span-1">
                      <div className="flex items-center mb-6">
                        <div className="bg-white p-2 rounded-sm">
                           <Logo className="h-8 w-auto text-slate-900" />
                        </div>
                        <div className="ml-3 flex flex-col">
                          <span className="text-lg font-black text-white tracking-tighter uppercase leading-none">Schindler</span>
                          <span className="text-xs font-bold text-slate-400 uppercase tracking-widest leading-none">Spring Co.</span>
                        </div>
                      </div>
                      <p className="text-slate-400 text-sm leading-relaxed mb-6">
                        Custom spring manufacturing since 1918. Dedicated to quality, precision, and rapid delivery for industries across the nation.
                      </p>
                    </div>

                    {/* Quick Links */}
                    <div>
                      <h4 className="text-sm font-bold uppercase tracking-widest text-orange-500 mb-6">Navigation</h4>
                      <ul className="space-y-3 text-sm text-slate-300">
                        <li><a href="#home" className="hover:text-white hover:translate-x-1 transition-all inline-block">Home</a></li>
                        <li><a href="#about" className="hover:text-white hover:translate-x-1 transition-all inline-block">About Us</a></li>
                        <li><a href="#products" className="hover:text-white hover:translate-x-1 transition-all inline-block">Products & Services</a></li>
                        <li><a href="#contact" className="hover:text-white hover:translate-x-1 transition-all inline-block">Request Quote</a></li>
                      </ul>
                    </div>

                    {/* Contact Info */}
                    <div className="col-span-1 md:col-span-2 lg:col-span-2">
                      <h4 className="text-sm font-bold uppercase tracking-widest text-orange-500 mb-6">Contact Us</h4>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-slate-800 p-6 rounded-sm border border-slate-700">
                          <h5 className="font-bold text-white mb-4 flex items-center">
                            <MapPin className="text-orange-500 mr-2" size={18} /> Location
                          </h5>
                          <address className="not-italic text-slate-400 text-sm leading-relaxed">
                            12165 Highway 190 W<br/>
                            Hammond, LA 70471
                          </address>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-sm border border-slate-700">
                           <h5 className="font-bold text-white mb-4 flex items-center">
                            <Phone className="text-orange-500 mr-2" size={18} /> Direct Line
